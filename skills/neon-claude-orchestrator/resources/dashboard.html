<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Antigravity (Neon) × Claude Code Orchestration Monitor</title>
  <style>
    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --neon: #38bdf8;
      --neon-bg: rgba(56, 189, 248, 0.12);
      --claude: #f59e0b;
      --claude-bg: rgba(245, 158, 11, 0.12);
      --ok: #3fb950;
      --err: #f85149;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(13, 17, 23, 0.92);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    header h1 {
      margin: 0;
      font-size: 18px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    button, .file-label {
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
    }
    button:hover, .file-label:hover {
      border-color: var(--neon);
    }
    main {
      max-width: 980px;
      margin: 24px auto;
      padding: 0 20px 60px;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin-bottom: 24px;
    }
    .stat-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 16px;
    }
    .stat-label { font-size: 12px; color: var(--muted); }
    .stat-value { font-size: 20px; font-weight: 700; margin-top: 4px; }
    .timeline {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .msg {
      border-radius: 12px;
      padding: 14px 18px;
      border: 1px solid var(--border);
      max-width: 88%;
    }
    .msg.neon {
      align-self: flex-start;
      background: var(--neon-bg);
      border-color: rgba(56, 189, 248, 0.35);
    }
    .msg.claude {
      align-self: flex-end;
      background: var(--claude-bg);
      border-color: rgba(245, 158, 11, 0.35);
    }
    .msg-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
      font-size: 12px;
      flex-wrap: wrap;
    }
    .sender { font-weight: 700; font-size: 13px; }
    .msg.neon .sender { color: var(--neon); }
    .msg.claude .sender { color: var(--claude); }
    .badges { display: flex; gap: 6px; flex-wrap: wrap; }
    .badge {
      background: rgba(255,255,255,0.08);
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      color: var(--muted);
    }
    .badge.ok { color: var(--ok); }
    .badge.err { color: var(--err); }
    .msg-body {
      white-space: pre-wrap;
      word-break: break-word;
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: 13px;
      background: rgba(0, 0, 0, 0.25);
      padding: 10px 12px;
      border-radius: 8px;
      max-height: 420px;
      overflow-y: auto;
    }
    .empty {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
      background: var(--panel);
      border: 1px dashed var(--border);
      border-radius: 12px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Neon × Claude Code Orchestration Monitor</h1>
    <div class="controls">
      <label class="file-label">
        Load comm_log.jsonl
        <input id="fileInput" type="file" accept=".jsonl,.json" style="display:none" />
      </label>
      <button onclick="location.reload()">Refresh</button>
    </div>
  </header>

  <main>
    <div class="stats" id="stats"></div>
    <div class="timeline" id="timeline"></div>
  </main>

  <script src="./dashboard_data.js"></script>
  <script>
    function render(logs) {
      const timeline = document.getElementById("timeline");
      const stats = document.getElementById("stats");
      timeline.innerHTML = "";

      if (!logs || logs.length === 0) {
        stats.innerHTML = "";
        timeline.innerHTML = `<div class="empty">No orchestration logs yet.<br/>Run an Antigravity × Claude Code orchestration task to see Neon ↔ Claude Code messages here.</div>`;
        return;
      }

      const sessions = new Set(logs.map(l => l.session_id).filter(Boolean));
      const claudeReplies = logs.filter(l => l.direction === "claude_to_neon");
      const avgMs = claudeReplies.length
        ? Math.round(claudeReplies.reduce((a, b) => a + (Number(b.duration_ms) || 0), 0) / claudeReplies.length)
        : 0;

      stats.innerHTML = `
        <div class="stat-card"><div class="stat-label">Total Messages</div><div class="stat-value">${logs.length}</div></div>
        <div class="stat-card"><div class="stat-label">Claude Calls</div><div class="stat-value">${claudeReplies.length}</div></div>
        <div class="stat-card"><div class="stat-label">Active Sessions</div><div class="stat-value">${sessions.size}</div></div>
        <div class="stat-card"><div class="stat-label">Avg Latency</div><div class="stat-value">${(avgMs / 1000).toFixed(1)}s</div></div>
      `;

      logs.forEach(item => {
        const isNeon = item.direction === "neon_to_claude";
        const card = document.createElement("div");
        card.className = "msg " + (isNeon ? "neon" : "claude");
        const timeStr = item.timestamp ? new Date(item.timestamp).toLocaleString() : "";
        const statusBadge = item.exit_code !== undefined && item.exit_code !== null
          ? `<span class="badge ${item.exit_code === 0 ? "ok" : "err"}">exit: ${escapeHtml(item.exit_code)}</span>`
          : "";
        const durMs = Number(item.duration_ms);
        const durBadge = durMs > 0 ? `<span class="badge">${(durMs / 1000).toFixed(1)}s</span>` : "";
        const roBadge = item.read_only ? `<span class="badge">ReadOnly</span>` : "";
        const sessBadge = item.session_id ? `<span class="badge">session: ${escapeHtml(String(item.session_id).slice(0, 8))}</span>` : "";

        card.innerHTML = `
          <div class="msg-header">
            <span class="sender">${escapeHtml(item.sender || "")} → ${escapeHtml(item.recipient || "")}</span>
            <div class="badges">
              <span class="badge">${escapeHtml(item.role || "worker")}</span>
              ${roBadge}${sessBadge}${durBadge}${statusBadge}
              <span class="badge">${escapeHtml(timeStr)}</span>
            </div>
          </div>
          <div class="msg-body">${escapeHtml(item.message || "")}</div>
        `;
        timeline.appendChild(card);
      });
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function parseJsonl(text) {
      return String(text || "")
        .split(/\r?\n/)
        .filter(l => l.trim())
        .map(l => { try { return JSON.parse(l); } catch { return null; } })
        .filter(x => x && typeof x === "object" && !Array.isArray(x));
    }

    document.getElementById("fileInput").addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => render(parseJsonl(reader.result));
      reader.readAsText(file, "utf-8");
    });

    // dashboard_data.js stores the raw JSONL as a string; older versions stored an array directly.
    render(typeof window.ORCHESTRATION_LOGS_JSONL === "string"
      ? parseJsonl(window.ORCHESTRATION_LOGS_JSONL)
      : (Array.isArray(window.ORCHESTRATION_LOGS) ? window.ORCHESTRATION_LOGS : []));
  </script>
</body>
</html>
